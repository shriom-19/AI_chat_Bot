{% extends "base.html" %}
{% block content %}
<h1>Edit Bot</h1>
<form method="post" action="/bots/{{ bot.id }}/edit" class="form">
  <label>Bot Name</label>
  <input type="text" name="name" value="{{ bot.name }}" required>

  <label>Website URL</label>
  <input type="url" name="website_url" value="{{ bot.website_url }}" required>

  <label>Description</label>
  <textarea name="description" rows="2">{{ bot.description }}</textarea>

  <label>System Prompt</label>
  <textarea name="system_prompt" rows="4">{{ bot.system_prompt }}</textarea>

  <button type="submit" class="btn">Save Changes</button>
  <a href="/bots/{{ bot.id }}">Cancel</a>
</form>
{% endblock %}
